name: Deceiv
run-name: Deceiv Build Version ${{ inputs.project_version }}
on:
  workflow_dispatch:
    inputs:
      project_version:
        description: 'Current project version: (e.g. 26.1.0)'
        required: true
      minecraft_version:
        description: 'Lowest supported MC version: (e.g. 26.1.2)'
        required: true
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check version
        run: |
          if git rev-parse --verify 'refs/tags/${{ inputs.project_version }}' >/dev/null 2>&1; then
            echo 'Version ${{ inputs.project_version }} already exists!'
            exit 1
          fi
      - name: replace version and hash
        run: |
          sed -i 's/INDEV/${{ inputs.project_version }}/g' build.gradle.kts
          echo 'Replaced INDEV with '${{ inputs.project_version }}' successfully!'
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: gradle shadowJar
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/libs/deceiv.jar
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check version
        run: |
          if git rev-parse --verify 'refs/tags/${{ inputs.project_version }}' >/dev/null 2>&1; then
            echo 'Version ${{ inputs.project_version }} already exists!'
            exit 1
          fi
      - name: replace version and hash
        run: |
          sed -i 's/PACK_VERSION/${{ inputs.project_version }}/g' pack.mcmeta
          echo 'Replaced PACK_VERSION with '${{ inputs.project_version }}' successfully!'
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          sed -i 's/GIT_HASH/$calculatedSha/g' pack.mcmeta
          echo 'Replaced GIT_HASH with '$calculatedSha' successfully!'
      - uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: options.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: deceiv.zip
  publish:
    needs: [plugin, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: Kir-Antipov/mc-publish@v3
        with:
          name: Deceiv v${{ inputs.project_version }} (for MC ${{ inputs.minecraft_version }}+)
          version: ${{ inputs.project_version }}
          files: |
            artifacts/plugin/deceiv.jar
            artifacts/pack/deceiv.zip
          loaders: |
            paper
            minecraft
          game-versions: '>=${{ inputs.minecraft_version }}'
          modrinth-id: AnCT3bvm
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
